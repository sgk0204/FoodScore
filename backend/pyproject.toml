[project]
name = "foodscore-backend"
version = "0.1.0"
description = "FoodScore API and worker: vision-LLM label extraction + deterministic health scoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "pillow>=10.4",
    "zxing-cpp>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.13",
    "prometheus-client>=0.20",
    "anthropic>=0.70",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "fakeredis>=2.24",
    "testcontainers[postgres,redis]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.services.extraction" = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "E501",   # line length is enforced by `ruff format`; long strings are allowed
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF001", # allow unicode in user-facing strings (e.g. "≤")
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ASYNC240"]
"app/schemas/api.py" = ["S105"]  # token_type = "bearer" is not a secret
"app/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs real Postgres + Redis via Testcontainers (Docker)",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]  # SQLAlchemy async runs on greenlets
omit = ["app/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
