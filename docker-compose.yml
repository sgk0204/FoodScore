# Local development: `cp .env.example .env && docker compose up --build`
#   Frontend  http://localhost:3000
#   API docs  http://localhost:8000/docs
#   MinIO     http://localhost:9001  (minioadmin / minioadmin)

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://foodscore:foodscore@postgres:5432/foodscore
    REDIS_URL: redis://redis:6379/0
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://minio:9000
    S3_BUCKET: foodscore-images
    S3_REGION: us-east-1
    S3_ACCESS_KEY_ID: minioadmin
    S3_SECRET_ACCESS_KEY: minioadmin
    JOB_MODE: arq
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }

services:
  api:
    <<: *backend
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: ["arq", "app.workers.settings.WorkerSettings"]
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy } # api runs the migrations first

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: http://api:8000 }
    environment: { BACKEND_URL: http://api:8000 }
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodscore
      POSTGRES_PASSWORD: foodscore
      POSTGRES_DB: foodscore
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodscore"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # Creates the bucket with a 1-day expiry rule: the safety net behind "images are temporary" (ADR-5).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/foodscore-images &&
             mc ilm rule add --expire-days 1 local/foodscore-images || true"

volumes:
  pgdata:
  miniodata:
