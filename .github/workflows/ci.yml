# Pull requests and pushes: lint → type check → unit → integration → build → security scan (guide §4.6).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'eval/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - name: Lint + format
        run: ruff check app tests scripts ../eval && ruff format --check app tests scripts ../eval
      - name: Type check
        run: mypy app
      - name: Unit + API tests (coverage gate)
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80
      - name: Scoring engine coverage ≥ 90 %
        run: coverage report --include="app/services/scoring/*" --fail-under=90
      - name: Integration tests (real Postgres + Redis via Testcontainers, incl. migrations)
        run: pytest -m integration -o addopts=""
      - name: Eval harness smoke run (recorded fixtures, no API cost)
        working-directory: .
        run: python -m pytest eval -q && python -m eval.run --provider fake --no-write --min-exact 1.0
      - name: OpenAPI contract has not drifted from the frontend copy
        run: |
          python scripts/export_openapi.py /tmp/openapi.json
          diff -u ../frontend/lib/api/openapi.json /tmp/openapi.json
      - name: Dependency audit
        run: pip-audit --skip-editable

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code lib/api/schema.d.ts
      - run: npm test
      - run: npm run build
      - name: Band colour classes survived Tailwind purging
        # Searches all built CSS: webpack writes static/css/, Turbopack (Next 16) static/chunks/.
        run: grep -rlq "bg-band-bad" .next/static --include="*.css"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }
      - run: npm audit --audit-level=high --omit=dev

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  docker:
    needs: [backend, frontend]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t foodscore-api ./backend
      - run: docker build -t foodscore-web ./frontend
